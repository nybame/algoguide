<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AlgoGuide 프로토타입</title>
<style>
:root{
  --bg:#0d1017;--panel:#171b24;--panel2:#1f2532;--line:#2b3242;
  --text:#eef1f7;--sub:#97a0b3;--blue:#5b8cff;--green:#3ee08a;--danger:#ff6b6b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(circle at 50% 0%,#1a2030,#05070b 70%);color:var(--text);
  font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit}

/* 폰 프레임 */
.phone{position:relative;width:390px;height:844px;max-height:96vh;border-radius:50px;background:var(--bg);
  border:11px solid #1a1d24;box-shadow:0 0 0 2px #333845,0 30px 80px rgba(0,0,0,.7);overflow:hidden}
.phone::after{content:"";position:absolute;inset:0;border-radius:40px;pointer-events:none;
  box-shadow:inset 0 0 0 0 transparent;transition:box-shadow .4s}
.phone.guard-on::after{box-shadow:inset 0 0 0 2px var(--green),inset 0 0 40px rgba(62,224,138,.25)}
.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:110px;height:30px;background:#000;border-radius:20px;z-index:50}
@media (max-width:500px){
  .phone{width:100vw;height:100vh;height:100dvh;max-height:none;border:none;border-radius:0;box-shadow:none}
  .phone::after{border-radius:0}
  .notch{display:none}
}

/* 화면 */
.screen{position:absolute;inset:0 0 84px 0;overflow-y:auto;display:none;padding:48px 0 24px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.active{display:block}
.pad{padding:0 18px}

/* 하단 내비 */
.nav{position:absolute;left:0;right:0;bottom:0;height:84px;background:rgba(13,16,23,.96);border-top:1px solid var(--line);
  display:flex;align-items:flex-start;justify-content:space-around;padding-top:10px;z-index:20}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--sub);width:74px;white-space:nowrap;position:relative}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--text)}
.nav button.on:not(.center)::before{content:"";position:absolute;top:-11px;width:40px;height:3px;border-radius:2px;background:var(--text)}
.nav .center{width:62px;height:62px;border-radius:50%;margin-top:-26px;justify-content:center;font-size:12px;font-weight:800;color:#fff;
  background:radial-gradient(circle at 35% 30%,#4a5a85,#1e2740);border:2px solid #4b5a80;box-shadow:0 6px 20px rgba(0,0,0,.6),0 0 18px rgba(91,140,255,.35)}
.phone.guard-on .nav .center{background:radial-gradient(circle at 35% 30%,#3a9a6a,#123524);border-color:#3ee08a;box-shadow:0 6px 20px rgba(0,0,0,.6),0 0 20px rgba(62,224,138,.5)}

/* 가드 알약 */
.guard-pill{margin:4px 14px 14px;padding:12px 12px 12px 20px;border-radius:40px;display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(135deg,#3a4566,#262d42);border:1.5px solid #5a6792;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.guard-pill h2{font-size:21px;font-weight:800;letter-spacing:-.5px}
.guard-pill small{font-size:12px;color:#c5cbe0}
.pill-right{display:flex;align-items:center;gap:8px}
.pill-icon{width:44px;height:44px;color:#9fb8ff}
.toggle{width:60px;height:60px;border-radius:50%;font-weight:900;font-size:16px;background:radial-gradient(circle at 35% 30%,#fff,#cfd4e2);color:#1b2030;
  box-shadow:0 3px 10px rgba(0,0,0,.5);transition:.3s}
.phone.guard-on .guard-pill{background:linear-gradient(135deg,#1f5a40,#173225);border-color:#3ee08a}
.phone.guard-on .toggle{background:radial-gradient(circle at 35% 30%,#b9ffd9,#3ee08a);color:#0b2a1a}

.topbar{display:flex;justify-content:space-between;align-items:center;padding:0 18px 10px}
.topbar h1{font-size:20px;font-weight:800}
.icon-btn{width:34px;height:34px;display:flex;align-items:center;justify-content:center}
.icon-btn svg{width:22px;height:22px}

.banner{margin:0 0 14px;padding:9px 16px;font-size:12.5px;background:#232937;color:#d9deea;display:flex;align-items:center;gap:8px}
.banner.green{background:#173a2a;color:#b8f5d3}
.banner.purple{background:#2c2550;color:#ddd5ff}
.banner button{margin-left:auto;font-size:12px;padding:4px 10px;border-radius:12px;background:rgba(255,255,255,.15);flex-shrink:0}

.sec-title{display:flex;justify-content:space-between;align-items:center;padding:0 18px;margin:6px 0 10px}
.sec-title h3{font-size:17px;font-weight:800}
.sec-title span{color:var(--sub);font-size:20px}

.hrow{display:flex;align-items:flex-start;gap:10px;overflow-x:auto;padding:0 18px 4px;scrollbar-width:none}
.hrow::-webkit-scrollbar{display:none}

/* 썸네일 */
.thumb{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:16/9;width:100%}
.thumb{display:flex;align-items:center;justify-content:center}
.thumb .emo{font-size:44px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35))}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fallback{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;text-decoration:none;color:#fff}
.fallback img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.55)}
.fallback .play{position:relative;width:68px;height:48px;border-radius:14px;background:#ff0033;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.fallback b{position:relative;font-size:14px;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.subbars .bar-row{grid-template-columns:104px 1fr 30px;white-space:nowrap}
.result b{color:#fff}
.arrows{display:flex;gap:6px}
.arrows button{width:30px;height:30px;border-radius:50%;background:#252b38;font-size:18px;line-height:1;color:var(--text)}
.arrows button:hover{background:#343c4e}
.hrow{scroll-behavior:auto;cursor:grab;user-select:none}
.hrow img{pointer-events:none}
.loading{display:flex;justify-content:center;gap:6px;padding:18px 0 30px;visibility:hidden}
.loading span{width:8px;height:8px;border-radius:50%;background:var(--sub);animation:blink 1s infinite}
.loading span:nth-child(2){animation-delay:.2s}.loading span:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.2}}
.sheet{max-height:92%;overflow-y:auto}
.next-h{font-size:14px;margin:18px 0 10px}
.nx{display:flex;gap:10px;width:100%;text-align:left;margin-bottom:10px}
.nx-t{flex:0 0 140px}
.nx b{font-size:13px;display:block;line-height:1.35}
.nx small{font-size:11.5px;color:var(--sub)}
.kws{display:flex;flex-wrap:wrap;gap:6px}
.kw{font-size:12.5px;padding:5px 10px;border-radius:14px;background:#2c3344}
.kw b{color:var(--blue)}
.refresh-btn{font-size:12.5px;padding:6px 12px;border-radius:16px;background:#252b38;margin-right:4px}
.refresh-btn:hover{background:#343c4e}
.pull{position:absolute;top:0;left:0;right:0;height:0;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;font-size:12px;color:var(--sub);z-index:15;transition:height .15s;padding-bottom:6px;pointer-events:none}
.pull.ready{color:var(--blue)}
.notice{font-size:12px;color:var(--sub);line-height:1.5;margin-top:10px}
.thumb .chip-tag{position:absolute;left:6px;top:6px;font-size:10px;background:rgba(0,0,0,.7);padding:2px 6px;border-radius:5px}
.card-s{flex:0 0 200px;text-align:left}
.card-s .t2{font-size:12.5px;font-weight:600;margin-top:6px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.player{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.yt-link{display:block;text-align:center;font-size:12.5px;color:var(--sub);margin-top:10px;text-decoration:underline}

.vlist .v{display:block;width:100%;text-align:left;margin-bottom:16px}
.vlist .thumb{border-radius:0}
.vlist .meta{display:flex;gap:10px;padding:10px 18px 0}
.avatar{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;background:var(--panel2)}
.meta b{font-size:14px;font-weight:700;display:block;line-height:1.35}
.meta small{font-size:12px;color:var(--sub)}

/* 되돌리기 카드 */
.rewind{margin:16px 18px;padding:14px 16px;border-radius:16px;background:linear-gradient(135deg,#2a3142,#1d2230);border:1.5px solid #4a5675;
  display:flex;align-items:center;gap:14px;width:calc(100% - 36px);text-align:left;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.rewind svg{width:36px;height:36px;flex-shrink:0}
.rewind b{font-size:17px;font-weight:800;display:block}
.rewind small{font-size:12px;color:var(--sub)}

/* 스페이스 카드 */
.sp-card{flex:0 0 170px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.sp-head{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--sub);margin-bottom:8px}
.sp-head .avatar{width:26px;height:26px;font-size:13px}
.sp-card b{font-size:14px;display:block;min-height:38px;line-height:1.35}
.btn{width:100%;padding:9px;border-radius:9px;background:#2c3344;font-size:13px;font-weight:600;margin-top:10px}
.btn.primary{background:var(--blue);color:#fff}
.btn.green{background:var(--green);color:#0b2a1a}
.btn.danger{background:#3a2228;color:#ffb3b3}
.btn:disabled{opacity:.4}

/* 막대 */
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:62px 1fr 34px;align-items:center;gap:8px;font-size:12.5px}
.bar-track{height:10px;background:#252b38;border-radius:6px;position:relative;overflow:hidden}
.bar-fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;transition:width .4s}
.bar-ghost{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:rgba(255,255,255,.18)}
.bar-row .num{text-align:right;color:var(--sub);font-variant-numeric:tabular-nums}
.mini .bar-row{grid-template-columns:44px 1fr;font-size:11px}
.mini .bar-track{height:6px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 18px 14px}
.panel h4{font-size:15px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.panel h4 small{font-size:12px;color:var(--sub);font-weight:400}
.muted{color:var(--sub);font-size:12.5px;line-height:1.5}

/* 가드 화면 */
#s-guard{background:radial-gradient(ellipse at 50% 55%,#2a3226,#161a15 60%,#101310)}
.phone.guard-on #s-guard{background:radial-gradient(ellipse at 50% 55%,#1f4a33,#11241a 60%,#0b140f)}
.g-tab{margin:0 0 0 18px;display:inline-block;font-size:12px;color:#c9cfbf;padding:6px 14px;border:1px solid #4a5244;border-radius:8px 18px 0 0;background:rgba(255,255,255,.04)}
.g-wrap{display:flex;flex-direction:column;align-items:center;margin-top:60px;position:relative}
.rings{position:absolute;top:210px;width:280px;height:90px;border-radius:50%;
  box-shadow:0 0 0 2px rgba(62,224,138,.35),0 0 0 22px rgba(62,224,138,.08),0 0 0 24px rgba(62,224,138,.3),0 0 40px rgba(62,224,138,.35);
  transform:scaleY(.9);transition:.4s}
.phone.guard-on .rings{box-shadow:0 0 0 3px rgba(62,224,138,.8),0 0 0 22px rgba(62,224,138,.15),0 0 0 25px rgba(62,224,138,.6),0 0 70px rgba(62,224,138,.7);animation:pulse 2s infinite}
@keyframes pulse{50%{transform:scaleY(.9) scale(1.05)}}
.orb{position:relative;z-index:2;width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.55),rgba(255,255,255,.08) 35%,rgba(120,130,140,.15) 60%,rgba(20,24,30,.6));
  border:1.5px solid rgba(255,255,255,.35);box-shadow:inset 0 -20px 40px rgba(0,0,0,.4),0 20px 40px rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;transition:.3s}
.orb:active{transform:scale(.96)}
.orb svg{width:110px;height:110px;color:#6fa0ff;filter:drop-shadow(0 0 12px rgba(91,140,255,.9));transition:.3s}
.phone.guard-on .orb svg{color:#5dffa8;filter:drop-shadow(0 0 16px rgba(62,224,138,1))}
.g-label{position:relative;z-index:3;margin-top:-12px;padding:4px 18px;font-size:28px;font-weight:600;letter-spacing:1px;
  background:linear-gradient(#5a5f55,#3d4139);border:2px solid #8d9385;border-radius:6px;color:#f3f3ea}
.g-desc{margin-top:120px;text-align:center;font-size:13px;color:#c6ccbd;line-height:1.6;padding:0 30px}
.g-status{margin-top:26px;text-align:center;font-size:12.5px;color:#a9b0a0}
.g-stat{display:inline-block;margin-top:10px;font-size:12px;padding:5px 12px;border-radius:12px;background:rgba(255,255,255,.07)}

/* 기록 화면 */
.back{display:flex;align-items:center;gap:6px;padding:0 18px 14px;font-size:18px;font-weight:800}
.back svg{width:22px;height:22px}
.clock{display:flex;justify-content:space-between;align-items:center}
.clock b{font-size:22px;font-variant-numeric:tabular-nums}
.chip{padding:7px 12px;border-radius:16px;background:#2c3344;font-size:12.5px;white-space:nowrap}
.chip.on{background:var(--text);color:#111}
.snap{display:flex;align-items:center;gap:12px;width:100%;padding:12px 4px;border-bottom:1px solid var(--line);text-align:left}
.snap:last-child{border-bottom:none}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--sub);flex-shrink:0}
.snap.sel .dot{background:var(--blue);border-color:var(--blue)}
.snap .t{font-weight:700;font-size:14px;width:84px;flex-shrink:0}
.snap .s{font-size:12px;color:var(--sub)}
.snap.cur{opacity:.7;cursor:default}

/* 검색 */
.search{display:flex;align-items:center;gap:8px;background:var(--panel2);border-radius:12px;padding:10px 14px;margin:0 18px 12px}
.search input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:14px}
.search svg{width:18px;height:18px;color:var(--sub)}

/* 스위치 */
.sw{width:46px;height:26px;border-radius:13px;background:#3a4152;position:relative;transition:.2s;flex-shrink:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--green)}
.sw.on::after{left:23px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}

/* 모달 */
.modal{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none;align-items:flex-end}
.modal.show{display:flex}
.sheet{width:100%;background:var(--panel);border-radius:22px 22px 0 0;padding:18px 18px 30px;animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .thumb{height:200px;border-radius:12px}
.sheet h3{font-size:17px;margin:12px 0 4px}
.result{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:13px}
.result.ok{background:#1d2a45;color:#c7d7ff}
.result.blocked{background:#173a2a;color:#b8f5d3}
.btns{display:flex;gap:8px}

.toast{position:absolute;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:#eef1f7;color:#111;font-size:13px;font-weight:600;
  padding:10px 16px;border-radius:20px;opacity:0;transition:.3s;z-index:60;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="notch"></div>

  <!-- 홈 -->
  <div class="pull" id="pullInd"></div>
  <section class="screen active" id="s-home"></section>
  <!-- 탐색 -->
  <section class="screen" id="s-search"></section>
  <!-- 가드 -->
  <section class="screen" id="s-guard"></section>
  <!-- 스페이스 -->
  <section class="screen" id="s-space"></section>
  <!-- 마이 -->
  <section class="screen" id="s-my"></section>
  <!-- 기록(되돌리기) -->
  <section class="screen" id="s-history"></section>

  <nav class="nav" id="nav">
    <button data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 11l9-7.5L21 11v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>홈</button>
    <button data-go="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>탐색</button>
    <button class="center" data-go="guard" id="navCenter">ON/OFF</button>
    <button data-go="space"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-3.5 3.2-5.5 6.5-5.5s6 2 6.5 5.5"/><path d="M17 4.5a3.5 3.5 0 0 1 0 7M19 14.8c1.5.8 2.4 2.5 2.6 5.2"/></svg>알고리즘 스페이스</button>
    <button data-go="my"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c.6-4 3.8-6.5 8-6.5s7.4 2.5 8 6.5"/></svg>마이</button>
  </nav>

  <div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
  <div class="toast" id="toast"></div>
</div>

<script>
/* =====================================================================
   AlgoGuide - TF-IDF 벡터 기반 추천
   영상마다 주제를 미리 붙이지 않고, 제목을 숫자 벡터로 바꿔서
   "내 취향 벡터"와 얼마나 비슷한지(코사인 유사도)로 추천한다.
   ===================================================================== */

function dot(a,b){ let s=0; const [x,y]=Object.keys(a).length<Object.keys(b).length?[a,b]:[b,a]; for(const k in x) if(y[k]) s+=x[k]*y[k]; return s; }
function norm(a){ let s=0; for(const k in a) s+=a[k]*a[k]; return Math.sqrt(s); }
function cos(a,b){ const n=norm(a)*norm(b); return n?dot(a,b)/n:0; }
function addVec(P,v,w){ for(const k in v) P[k]=(P[k]||0)+w*v[k]; }
function scaleVec(P,s){ for(const k in P) P[k]*=s; }
function prune(P,n=800){
  const e=Object.entries(P).filter(x=>Math.abs(x[1])>0.003).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).slice(0,n);
  for(const k in P) delete P[k]; e.forEach(([k,x])=>P[k]=x); return P;
}
const words = (P,n,neg) => Object.entries(P).filter(([k,x])=>k.startsWith("w:") && (neg?x<0:x>0)).sort((a,b)=>neg?a[1]-b[1]:b[1]-a[1]).slice(0,n).map(([k,x])=>[k.slice(2),x]);

const VIDEOS = RAW.map(([tag,sub,yt,title],i)=>{
  const vec=toVec(DOC_F[i]);
  return {id:i,yt,title,vec,color:COLORS[i%COLORS.length],top:words(vec,2).map(x=>x[0]),noise:((i*53)%17)/400};
});

  return prune(P);
}

function recentSim(v,f){
  let best=0; (f.recent||[]).forEach((id,i)=>{ if(id!==v.id){ const c=cos(VIDEOS[id].vec,v.vec)*[1,0.6,0.4][i]; if(c>best) best=c; } });
  return best;
}
function val(v,f){
  if(isEmpty(f.P) && !(f.recent||[]).length) return v.noise*20;   // 아직 아무것도 모를 때는 골고루
  return cos(f.P,v.vec) + recentSim(v,f)*0.6 + v.noise;
}
/* 한 다리 건너 비슷한 영상도 찾기:
   내 취향과 가까운 영상 몇 개를 고른 뒤, 그 영상들과 가까운 영상에도 점수를 준다.
   (판테온 매드무비 → 롤 정보 유튜버 매드무비 → 롤 챔피언 강의 처럼 이어짐) */
let hopBy = new Map();
function rank(f){
  const base = VIDEOS.map(v=>[v,val(v,f)]);
  hopBy = new Map();
  if(!isEmpty(f.P)){
    const seeds = base.filter(x=>x[1]>0.08).sort((a,b)=>b[1]-a[1]).slice(0,8);
    base.forEach(x=>{
      let h=0;
      seeds.forEach(([u,su])=>{ if(u.id!==x[0].id){ const c=cos(u.vec,x[0].vec)*su; if(c>h) h=c; } });
      if(h>0.01){ x[1]+=h*0.8; hopBy.set(x[0].id,h); }
    });
  }
  return base.sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
}
function similar(v,n){ return VIDEOS.filter(x=>x.id!==v.id).map(x=>[x,cos(v.vec,x.vec)+cos(feed().P,x.vec)*0.15]).sort((a,b)=>b[1]-a[1]).slice(0,n).map(x=>x[0]); }

/* 시청 시간 → 벡터에 더할 무게 */
function watchWeight(sec){

  if(sec<120) return {w:2,label:"관심 있게 봄"};
  if(sec<300) return {w:3,label:"오래 봄"};
  return {w:4,label:"끝까지 몰입"};
}
/* 취향 벡터 업데이트: 예전 기록은 조금씩 흐려지고(×0.97) 새 기록이 더해짐 */
function learn(v,w){
  if(w>0) scaleVec(S.P,0.97);
  addVec(S.P,v.vec,w);
  prune(S.P);
  if(w>0) S.recent=[v.id,...S.recent.filter(id=>id!==v.id)].slice(0,3);
  else S.recent=S.recent.filter(id=>id!==v.id);
  feedDirty=v.id;
}

/* 취향 벡터에서 가장 큰 단어들을 막대로 */
function kwBars(P,n,ghostP){
  let list=words(P,n);
  if(ghostP) list=[...new Map([...list,...words(ghostP,n)].map(([w])=>[w,[w,P["w:"+w]||0]])).values()].sort((a,b)=>b[1]-a[1]).slice(0,n);
  if(!list.length) return '<p class="muted">아직 쌓인 취향이 없어요. 영상을 10초 넘게 보면 생겨요.</p>';
  const max=Math.max(...list.map(([w,x])=>Math.max(x,ghostP?ghostP["w:"+w]||0:0)),0.01);
  return barRows(list.map(([w,x])=>[`#${w}`,x,colorOf(w),ghostP?ghostP["w:"+w]||0:0]),max,!!ghostP);

let exploreIds = new Set();
function reason(v,f){
  if(exploreIds.has(v.id)) return "새로운 영상 둘러보기";
  const last=(f.recent||[])[0];
  if(last!=null && last!==v.id && cos(VIDEOS[last].vec,v.vec)>0.25) return "방금 본 영상과 비슷해서";
  let best=null,bv=0;
  for(const k in v.vec) if(k.startsWith("w:")){ const c=(f.P[k]||0)*v.vec[k]; if(c>bv){bv=c;best=k.slice(2);} }
  if(best && bv>0.01) return `'${best}' 관심이 높아서`;
  if((hopBy.get(v.id)||0)>0.02) return "좋아한 영상과 이어진 영상";
  if(isEmpty(f.P)) return "취향을 알아가는 중";
  return "취향과 먼 영상 (둘러보기)";
}

let homeTop=null, homeShown=[], loadingMore=false;
function resetFeed(){ homeTop=null; homeShown=[]; exploreIds=new Set(); }
function nextBatch(n){
  const f=feed();
  let seen=new Set([...(homeTop||[]),...homeShown]);
  let cand=rank(f).filter(v=>!seen.has(v.id));
  if(cand.length<n){ homeShown=[]; seen=new Set(homeTop||[]); cand=rank(f).filter(v=>!seen.has(v.id)); }
  const out=[], explore=cand.slice(Math.floor(cand.length/2));
  for(let i=0;i<n && cand.length;i++){
    let v;
    if((homeShown.length+i)>=8 && (homeShown.length+i)%8===7 && explore.length && !isEmpty(f.P)){ v=explore.splice(Math.floor(Math.random()*explore.length),1)[0]; exploreIds.add(v.id); }
    else v=cand[0];
    cand=cand.filter(x=>x.id!==v.id);
    out.push(v.id);
  }
  return out;
}

function refillAfter(id){
  if(!homeTop) return;
  const ti=homeTop.indexOf(id), si=homeShown.indexOf(id);
  const shownLen=homeShown.length;
  if(ti>=0){
    const keep=homeTop.slice(0,ti+1);
    const rest=rank(feed()).filter(v=>!keep.includes(v.id)).slice(0,homeTop.length-keep.length).map(v=>v.id);
    homeTop=[...keep,...rest]; homeShown=[];
    homeShown.push(...nextBatch(shownLen));
  } else if(si>=0){
    homeShown=homeShown.slice(0,si+1);
    homeShown.push(...nextBatch(shownLen-homeShown.length));
  } else {
    homeShown=[]; homeShown.push(...nextBatch(shownLen));
  }
}

function attachRows(){
  document.querySelectorAll(".hrow").forEach(el=>{
    if(el._hs) return; el._hs=true;
    el.addEventListener("wheel",e=>{
      if(Math.abs(e.deltaY)<=Math.abs(e.deltaX)) return;
      const max=el.scrollWidth-el.clientWidth;
      if((e.deltaY>0 && el.scrollLeft<max-1) || (e.deltaY<0 && el.scrollLeft>0)){ el.scrollLeft+=e.deltaY; e.preventDefault(); }
    },{passive:false});
    let down=false,x0=0,s0=0,moved=false;
    el.addEventListener("pointerdown",e=>{ if(e.pointerType!=="mouse") return; down=true; moved=false; x0=e.clientX; s0=el.scrollLeft; });
    window.addEventListener("pointermove",e=>{ if(!down) return; const dx=e.clientX-x0; if(Math.abs(dx)>5) moved=true; if(moved) el.scrollLeft=s0-dx; });
    window.addEventListener("pointerup",()=>{ down=false; });
    el.addEventListener("click",e=>{ if(moved){ e.preventDefault(); e.stopPropagation(); moved=false; } },true);
    el.addEventListener("dragstart",e=>e.preventDefault());
  });
}

function searchResults(){
  const q=searchQ.trim();
  if(!q) return `<p class="muted pad">검색어를 입력하면 제목 벡터가 가까운 영상을 찾아요. 정확히 같은 단어가 아니어도 글자 조각이 겹치면 찾아져요.</p>`;
  const qv=toVec(features(q)), f=feed();
  const res=VIDEOS.map(v=>[v,cos(qv,v.vec)]).filter(x=>x[1]>0.05).map(([v,c])=>[v,c+cos(f.P,v.vec)*0.2]).sort((a,b)=>b[1]-a[1]);
  if(!res.length) return '<p class="muted pad">비슷한 영상을 찾지 못했어요.</p>';
  return `<p class="muted pad" style="margin-bottom:10px">${res.length}개 영상 · 검색어와 가까운 순</p>` + res.slice(0,50).map(x=>vItem(x[0])).join("");
}
function renderSearch(){
  const el=document.getElementById("s-search");
  if(!document.getElementById("q")){
    el.innerHTML = `
      <div class="topbar"><h1>탐색</h1></div>
      <div class="search">${ICON.search}<input id="q" placeholder="아무 말이나 검색 (예: 롤토체스, 쿠키, 우주)"></div>
      <div class="hrow" id="chips" style="margin-bottom:14px"></div>
      <div id="sBanner"></div>
      <div class="vlist" id="sResults"></div>`;
    const inp=document.getElementById("q");
    inp.value=searchQ;
    inp.addEventListener("input",e=>{ if(e.isComposing) return; searchQ=inp.value; updateResults(); });
    inp.addEventListener("compositionend",()=>{ searchQ=inp.value; updateResults(); });
  }
  const mine=words(feed().P,10).map(x=>x[0]);
  const chips=mine.length?mine:["롤","쿠키","러닝","우주","파이썬","고양이","캠핑","런닝맨"];
  document.getElementById("chips").innerHTML = `<span class="muted" style="font-size:12px;align-self:center;white-space:nowrap">${mine.length?'내 키워드':'예시'}</span>`+chips.map(t=>`<button class="chip ${searchQ===t?'on':''}" onclick="setQ('${t.replace(/'/g,"")}')">#${t}</button>`).join("");
  document.getElementById("sBanner").innerHTML = banner();
  updateResults();
}
function updateResults(){ document.getElementById("sResults").innerHTML = searchResults(); }
function setQ(t){ searchQ=t; document.getElementById("q").value=t; renderSearch(); }

function same(a,b){
  const keys=new Set([...Object.keys(a.P||{}),...Object.keys(b.P||{})]);
  for(const k of keys) if(Math.abs((a.P[k]||0)-(b.P[k]||0))>1e-6) return false;
  return true;
}
function defaultSnap(){
  for(let i=S.snaps.length-1;i>=0;i--) if(!same(S.snaps[i],S)) return S.snaps[i].hour;
  return lastSnap().hour;
}
function renderHistory(){
  const snaps = S.snaps.slice().reverse();
  if(selSnap===null || !S.snaps.find(s=>s.hour===selSnap)) selSnap = defaultSnap();
  const sel = S.snaps.find(s=>s.hour===selSnap);
  const isSame = same(sel,S);
  const sim = isEmpty(sel.P)||isEmpty(S.P) ? null : Math.round(cos(sel.P,S.P)*100);
  document.getElementById("s-history").innerHTML = `
    <button class="back" onclick="go('home')">${ICON.back}알고리즘 기록</button>

function render(){
  document.getElementById("phone").classList.toggle("guard-on",guardOn());
  document.getElementById("navCenter").textContent = guardOn()?"ON":"OFF";
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.go===screen));
  ({home:renderHome,search:renderSearch,guard:renderGuard,space:renderSpace,my:renderMy,history:renderHistory})[screen]();
  attachRows();
}
function go(name){
  screen=name;
  document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("active",s.id==="s-"+name));
  document.getElementById("s-"+name).scrollTop=0;
  render();
}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{
  if(b.dataset.go==="home" && screen==="home") refreshFeed();   // 홈에서 홈 탭을 한 번 더 누르면 새로고침
  else go(b.dataset.go);
});
/* 맨 위에서 아래로 당기면 새로고침 */
(function(){
  const el=document.getElementById("s-home"), ind=document.getElementById("pullInd");
  let y0=null, dy=0;
  el.addEventListener("touchstart",e=>{ y0 = el.scrollTop<=0 ? e.touches[0].clientY : null; dy=0; },{passive:true});
  el.addEventListener("touchmove",e=>{
    if(y0==null) return; dy=Math.max(0,e.touches[0].clientY-y0);
    ind.style.height=Math.min(dy*0.5,60)+"px"; ind.classList.toggle("ready",dy>110);
    ind.textContent = dy>110 ? "놓으면 새로고침" : "당겨서 새로고침";
  },{passive:true});
  el.addEventListener("touchend",()=>{
    if(y0!=null && dy>110){ ind.textContent="새로고침 중…"; setTimeout(()=>{ refreshFeed(); ind.style.height="0px"; },300); }
    else ind.style.height="0px";
    y0=null; dy=0;
  });
})();

/* ---------- 10. 동작 ---------- */
function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2200);
}
function toggleGuard(){
  if(S.temp){ endTemp(); S.guard=false; save(); render(); toast("가드를 껐어요"); return; }
  S.guard=!S.guard; addLog(S.guard?"🛡️ 가드 켬":"가드 끔"); save(); render();
  toast(S.guard?"🛡️ 가드 ON - 이제 기록이 학습되지 않아요":"가드 OFF - 다시 학습을 시작해요");
}
function applyTemp(id){
  S.temp=id; resetFeed(); addLog("👀 "+persona(id).name+" 알고리즘 임시 적용"); save(); render();
  toast(persona(id).name+"의 피드로 바꿨어요 (가드 자동 ON)");
}
function endTemp(){
  if(!S.temp) return; addLog("임시 적용 해제"); S.temp=null; resetFeed(); save(); render(); toast("내 알고리즘으로 돌아왔어요");
}
const fmt = s => Math.floor(s/60)+":"+String(s%60).padStart(2,"0");

/* 재생 환경 확인: 미리보기 창은 유튜브를 막고, 파일을 직접 열면 유튜브가 재생을 거부함 */
let EXT = null;
(function(){ const im=new Image(); im.onload=()=>{EXT=true}; im.onerror=()=>{EXT=false}; im.src="https://i.ytimg.com/vi/"+VIDEOS[0].yt+"/default.jpg"; })();
const canEmbed = () => EXT!==false && /^https?:$/.test(location.protocol);
let ytReady = false, ytLoading = false;
window.onYouTubeIframeAPIReady = () => { ytReady = true; };
function loadYT(){
  if(ytLoading || !canEmbed()) return; ytLoading = true;
  const s=document.createElement("script"); s.src="https://www.youtube.com/iframe_api"; document.head.appendChild(s);
}
loadYT();


/* 지금 보고 있는 영상 */
let W = null;
function watch(id){
  closeSheet(true);
  const v=VIDEOS[id];
  W = {v, sec:0, liked:false, mode:"wait", playing:false, player:null, committed:false};
  document.getElementById("sheet").innerHTML = `
    <div id="playerBox"></div>
    <h3>${v.title}</h3><p class="muted">${v.top.map(t=>"#"+t).join(" ")} · 지금 내 취향과 유사도 ${Math.round(Math.max(0,cos(feed().P,v.vec))*100)}%</p>
    <div id="liveBox" class="result ok"></div>
    <div class="btns"><button class="btn" id="likeBtn" onclick="like()">👍 좋아요</button><button class="btn" onclick="dislike()">🚫 관심 없음</button><button class="btn primary" onclick="closeSheet()">닫기</button></div>
    <a class="yt-link" id="ytLink" href="https://www.youtube.com/watch?v=${v.yt}" target="_blank" rel="noopener" onclick="openedOnYT()">YouTube에서 열기 ↗</a>
    <h4 class="next-h">다음 영상 <small class="muted" style="font-weight:400">제목 벡터가 가까운 순</small></h4>
    <div class="next">${similar(v,5).map(x=>`<button class="nx" onclick="watch(${x.id})"><div class="nx-t">${thumb(x)}</div><div><b>${x.title}</b><small>유사도 ${Math.round(cos(v.vec,x.vec)*100)}%</small></div></button>`).join("")}</div>`;
  document.getElementById("modal").classList.add("show");
  setupPlayer();
  W.timer = setInterval(tick,1000);
  tick();
}
function setupPlayer(){
  const v=W.v, box=document.getElementById("playerBox");
  if(!canEmbed()){ showFallback(EXT===false
      ? '지금 화면(미리보기)에서는 외부 영상이 차단돼요. 웹 주소(http)로 열면 앱 안에서 바로 재생돼요.'
      : '파일을 직접 열면 유튜브가 앱 안 재생을 막아요. 웹 주소(http)로 열면 여기서 바로 재생돼요.'); return; }
  box.innerHTML = `<div class="player"><div id="ytp"></div></div>`;
  const start = () => {
    if(!W || W.v!==v) return;
    W.mode="api";
    W.player = new YT.Player("ytp",{ videoId:v.yt, host:"https://www.youtube-nocookie.com",
      playerVars:{autoplay:1,playsinline:1,rel:0},
      events:{
        onStateChange:e=>{ if(W) W.playing = (e.data===1); },
        onError:()=>{ if(W){ W.playing=false; showFallback('올린 사람이 다른 사이트에서의 재생을 막아 둔 영상이에요. YouTube에서 보면 1분 시청으로 기록돼요.'); } }
      }});
  };
  if(ytReady) start();
  else {
    let n=0; const iv=setInterval(()=>{ n++;
      if(!W || W.v!==v){ clearInterval(iv); return; }
      if(ytReady){ clearInterval(iv); start(); }
      else if(n>=6){ clearInterval(iv);
        W.mode="iframe";
        box.innerHTML = `<div class="player"><iframe src="https://www.youtube-nocookie.com/embed/${v.yt}?autoplay=1&playsinline=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`; }
    },500);
  }
}
function showFallback(msg){
  if(!W) return;
  const v=W.v;
  W.mode="link"; W.playing=false;
  if(W.player){ try{ W.player.destroy(); }catch(e){} W.player=null; }
  document.getElementById("playerBox").innerHTML = `
    <a class="fallback" href="https://www.youtube.com/watch?v=${v.yt}" target="_blank" rel="noopener" onclick="openedOnYT()" style="background:linear-gradient(135deg,${v.color[0]},${v.color[1]})">
      <img src="https://i.ytimg.com/vi/${v.yt}/hqdefault.jpg" alt="" onerror="this.remove()">
      <span class="play">▶</span><b>YouTube에서 영상 보기</b></a>
    <p class="notice">${msg}</p>`;
  const l=document.getElementById("ytLink"); if(l) l.style.display="none";
}
function openedOnYT(){ if(W && W.sec<60){ W.sec=60; W.mode="link"; tick(); } }
function tick(){
  if(!W) return;
  if((W.mode==="api" && W.playing) || W.mode==="iframe") W.sec++;
  const p = watchWeight(W.sec), box=document.getElementById("liveBox");
  if(!box) return;
  const how = W.mode==="api" ? (W.playing?"▶ 재생 중":"⏸ 멈춤") : W.mode==="iframe" ? "▶ 창을 연 시간으로 계산" : W.mode==="link" ? "↗ YouTube에서 보면 1분 시청으로 기록" : "불러오는 중";
  if(guardOn()){
    box.className="result blocked";
    box.innerHTML=`⏱ ${fmt(W.sec)} · ${how}<br>🛡️ 가드가 켜져 있어서 이 시청 기록은 버려져요`;
  } else {
    box.className="result ok";
    box.innerHTML=`⏱ ${fmt(W.sec)} · ${how}<br>` + (p.w
      ? `지금 닫으면 <b>${p.label}</b>: 이 영상 벡터를 ×${p.w} 만큼 내 취향에 더해요`
      : `10초 넘게 봐야 알고리즘에 반영돼요`) + (W.liked?" (좋아요 ×1.5 반영됨)":"");
  }
}
function like(){
  if(!W || W.liked) return;
  W.liked=true;
  const lb=document.getElementById("likeBtn"); lb.disabled=true; lb.textContent="👍 좋아요 누름";
  if(guardOn()){ S.discarded++; addLog("🛡️ 👍 "+W.v.title+" (버림)"); }
  else { learn(W.v,1.5); addLog("👍 "+W.v.title); }
  save(); tick();
}
function dislike(){
  if(!W) return;
  const v=W.v; W.committed=true;
  if(guardOn()){ S.discarded++; addLog("🛡️ 🚫 "+v.title+" (버림)"); toast("🛡️ 가드 ON - 관심 없음도 반영하지 않았어요"); }
  else { learn(v,-2); addLog("🚫 관심 없음: "+v.title); toast(`관심 없음 → ${v.top.map(t=>"#"+t).join(" ")} 쪽 취향을 줄였어요`); }
  save(); closeSheet();
}
function commitWatch(){
  if(!W || W.committed) return; W.committed=true;
  const v=W.v, p=watchWeight(W.sec);
  if(guardOn()){
    S.discarded++; addLog(`🛡️ ${v.title} (${fmt(W.sec)}, 버림)`);
    toast("🛡️ 가드 ON - 시청 기록을 버렸어요");
  } else if(p.w){
    learn(v,p.w);
    addLog(`▶ ${v.title} (${fmt(W.sec)}, ${p.label})`);
    toast(`${p.label} → ${v.top.map(t=>"#"+t).join(" ")} 쪽 취향 ×${p.w}`);
  } else if(!W.liked) toast("10초 미만으로 봐서 알고리즘에 반영하지 않았어요");
  save();
}
function closeSheet(silent){
  if(W){
    clearInterval(W.timer);
    commitWatch();
    if(W.player){ try{ W.player.destroy(); }catch(e){} }
    W=null;
  }
  document.getElementById("modal").classList.remove("show");
  document.getElementById("sheet").innerHTML="";
  if(feedDirty!=null){ refillAfter(feedDirty); feedDirty=null; }
  if(!silent) render();
}
document.getElementById("modal").onclick=e=>{ if(e.target.id==="modal") closeSheet(); };

function advance(){
  S.hour++;
  scaleVec(S.P,0.9); prune(S.P);
  S.snaps.push({hour:S.hour,P:clone(S.P),recent:clone(S.recent)});
  if(S.snaps.length>48) S.snaps.shift();
  save(); render(); toast("⏱ "+tLabel(S.hour)+" 시점 저장됨");
}
function openHistory(){ selSnap=null; go("history"); }
function confirmSheet(title,body,okText,fn){
  document.getElementById("sheet").innerHTML = `<h3>${title}</h3><p class="muted" style="margin:6px 0 16px">${body}</p>
    <div class="btns"><button class="btn" onclick="closeSheet()">취소</button><button class="btn primary" id="okBtn">${okText}</button></div>`;
  document.getElementById("okBtn").onclick=()=>{ closeSheet(true); fn(); };
  document.getElementById("modal").classList.add("show");
}
function askRollback(){
  const sel=S.snaps.find(s=>s.hour===selSnap);
  confirmSheet("알고리즘 되돌리기",`내 취향 벡터를 ${tLabel(sel.hour)} 시점 상태로 바꿔요. 그 뒤로 더해진 취향은 사라져요.`,"되돌리기",()=>{
    S.P=clone(sel.P||{}); S.recent=clone(sel.recent||[]); resetFeed(); addLog("⏪ "+tLabel(sel.hour)+" 시점으로 되돌림"); save(); render();
    toast("⏪ "+tLabel(sel.hour)+" 알고리즘으로 되돌렸어요");
  });
}
function askReset(){
  confirmSheet("데이터 초기화","취향 벡터, 저장된 시점, 활동 기록을 모두 처음 상태로 돌려요.","초기화",()=>{
    S=defaults(); resetFeed(); save(); go("home"); toast("초기화했어요");
  });
}

render();
</script>
</body>
</html>
